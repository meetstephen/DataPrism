[theme]
primaryColor = "#00D4FF"
backgroundColor = "#0F1C2E"
secondaryBackgroundColor = "#1A2740"
textColor = "#F0F4F8"
font = "sans serif"

[server]
maxUploadSize = 200
headless = true

[browser]
gatherUsageStats = false

[client]
# DataPrism uses a compact fixed-position route picker instead of a long list
# whose scroll position is lost when Streamlit replaces the page DOM.
showSidebarNavigation = false

